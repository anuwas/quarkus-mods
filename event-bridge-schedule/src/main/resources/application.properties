# ===================================================================
# Quarkus Application Configuration
# ===================================================================
quarkus.http.port=8080

# ===================================================================
# AWS Credentials Configuration
# Replace the placeholder values with your actual AWS credentials
# ===================================================================
aws.access-key-id=
aws.secret-access-key=
aws.region=ap-south-1

# Optional: Override the AWS Scheduler endpoint (useful for local testing with LocalStack)
# aws.scheduler.endpoint-override=http://localhost:4566

# ===================================================================
# EventBridge Scheduler Configuration
# ===================================================================
#
# IMPORTANT: EventBridge Scheduler does NOT support API Destination ARNs
# directly as target ARNs. Instead, the Scheduler sends events to the
# default EventBridge event bus, and an EventBridge Rule routes them
# to the API Destination.
#
# Architecture:
#   Scheduler --> EventBridge Event Bus (default) --> Rule --> API Destination --> HTTP endpoint
#
# The EventBridge Rule "scheduler-to-api-destination" matches events with:
#   source: "custom.scheduler"
#   detail-type: "ScheduledEvent"
# and forwards them to the API Destination "my-api-destination".
#

# The ARN of the default EventBridge event bus (Scheduler target)
app.scheduler.event-bus-arn=

# The IAM Role ARN that EventBridge Scheduler assumes to put events on the bus.
# This role has:
#   - Trust policy for "scheduler.amazonaws.com"
#   - Permission: "events:PutEvents" on the default event bus
app.scheduler.role-arn=

