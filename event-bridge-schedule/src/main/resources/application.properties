# ===================================================================
# Quarkus Application Configuration
# ===================================================================
quarkus.http.port=8080

# ===================================================================
# AWS Credentials Configuration
# Replace the placeholder values with your actual AWS credentials
# ===================================================================
aws.access-key-id=
aws.secret-access-key=
aws.region=

# Optional: Override the AWS Scheduler endpoint (useful for local testing with LocalStack)
# aws.scheduler.endpoint-override=http://localhost:4566

# ===================================================================
# EventBridge Scheduler Configuration
# ===================================================================

# The ARN of the target that the scheduler will invoke at the scheduled time.
# This can be:
#   - An EventBridge API Destination ARN (to call an HTTP/HTTPS URL)
#     e.g. arn:aws:events:<region>:<account-id>:api-destination/<api-destination-name>/<uuid>
#   - A Lambda function ARN
#     e.g. arn:aws:lambda:<region>:<account-id>:function:<function-name>
#   - An SQS queue ARN
#     e.g. arn:aws:sqs:<region>:<account-id>:<queue-name>
#   - An SNS topic ARN
#     e.g. arn:aws:sns:<region>:<account-id>:<topic-name>
#
# To invoke an arbitrary HTTP URL, create an API Destination in EventBridge
# and provide its ARN here.
#
# IMPORTANT: The target ARN must be an API Destination ARN, NOT a Connection
# or Secrets Manager ARN. After creating a Connection, you must also create
# an API Destination that uses that Connection, then use the API Destination ARN here.
#
# Steps:
#   1. Create a Connection (you already did this - the Connection stores auth credentials
#      in Secrets Manager, which is why the ARN looks like arn:aws:secretsmanager:...)
#   2. Create an API Destination in EventBridge that references the Connection
#      and specifies the HTTP endpoint URL and method.
#   3. Copy the API Destination ARN (arn:aws:events:...:api-destination/...) here.
#
# Example API Destination ARN:
#   arn:aws:events:ap-south-1:accid:api-destination/my-api-destination/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#
app.scheduler.api-destination-arn=

# The IAM Role ARN that EventBridge Scheduler assumes to invoke the target.
# This role must have:
#   - Permission to invoke the API Destination (events:InvokeApiDestination)
#   - A trust policy allowing scheduler.amazonaws.com to assume the role
#
# IMPORTANT: Do NOT use the service-linked role "AWSServiceRoleForAmazonEventBridgeApiDestinations".
# You must create a custom IAM role with:
#   1. Trust policy for "scheduler.amazonaws.com"
#   2. Permission: "events:InvokeApiDestination" on the API Destination ARN
#
# Example:
#   app.scheduler.role-arn=arn:aws:iam::accid:role/EventBridgeSchedulerRole
app.scheduler.role-arn=

