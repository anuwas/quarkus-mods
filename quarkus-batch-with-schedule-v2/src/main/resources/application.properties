# =============================================================
# Quarkus Batch Demo V2 — High-Volume Configuration
# =============================================================

quarkus.application.name=quarkus-batch-demo
quarkus.application.version=2.0.0

# =============================================================
# STG Database (Source - stgdb)
# =============================================================
quarkus.datasource.stgdb.db-kind=postgresql
quarkus.datasource.stgdb.username=postgres
quarkus.datasource.stgdb.password=pgpass
quarkus.datasource.stgdb.jdbc.url=jdbc:postgresql://localhost:5432/stgdb

# V2: Raised pool sizes to match parallel worker count
quarkus.datasource.stgdb.jdbc.min-size=8
quarkus.datasource.stgdb.jdbc.max-size=30
quarkus.datasource.stgdb.jdbc.acquisition-timeout=PT30s
quarkus.datasource.stgdb.jdbc.leak-detection-interval=PT30s
quarkus.datasource.stgdb.jdbc.idle-removal-interval=PT5m
quarkus.datasource.stgdb.jdbc.max-lifetime=PT30m
quarkus.datasource.stgdb.jdbc.background-validation-interval=PT2m

# =============================================================
# MN Database (Target - mndb)
# =============================================================
quarkus.datasource.mndb.db-kind=postgresql
quarkus.datasource.mndb.username=postgres
quarkus.datasource.mndb.password=pgpass
quarkus.datasource.mndb.jdbc.url=jdbc:postgresql://localhost:5432/mndb

quarkus.datasource.mndb.jdbc.min-size=8
quarkus.datasource.mndb.jdbc.max-size=30
quarkus.datasource.mndb.jdbc.acquisition-timeout=PT30s
quarkus.datasource.mndb.jdbc.leak-detection-interval=PT30s
quarkus.datasource.mndb.jdbc.idle-removal-interval=PT5m
quarkus.datasource.mndb.jdbc.max-lifetime=PT30m
quarkus.datasource.mndb.jdbc.background-validation-interval=PT2m

# =============================================================
# Hibernate ORM — STG persistence unit
# =============================================================
quarkus.hibernate-orm.stgdb.datasource=stgdb
quarkus.hibernate-orm.stgdb.packages=com.demo.batch.entity.stg
quarkus.hibernate-orm.stgdb.database.generation=update
quarkus.hibernate-orm.stgdb.sql-load-script=db/stg-data.sql
quarkus.hibernate-orm.stgdb.log.sql=false
# V2: Larger JDBC batch size for bulk operations
quarkus.hibernate-orm.stgdb.jdbc.statement-batch-size=100

# =============================================================
# Hibernate ORM — MN persistence unit
# =============================================================
quarkus.hibernate-orm.mndb.datasource=mndb
quarkus.hibernate-orm.mndb.packages=com.demo.batch.entity.mn
quarkus.hibernate-orm.mndb.database.generation=update
quarkus.hibernate-orm.mndb.log.sql=false
quarkus.hibernate-orm.mndb.jdbc.statement-batch-size=100

# =============================================================
# Batch Processing — V2 high-volume defaults
# =============================================================
# V2: chunk-size raised from 100 → 1000 (10x fewer DB round trips per 1M rows)
batch.chunk-size=${BATCH_CHUNK_SIZE:1000}

# V2: parallel workers — should match CPU cores available to the JVM
batch.thread-pool-size=${BATCH_THREAD_POOL_SIZE:8}

batch.retry-attempts=3
batch.retry-delay-ms=1000

# V2: skip-limit now a percentage of chunk size (5% of 1000 = 50 skips per chunk)
batch.skip-limit-pct=${BATCH_SKIP_LIMIT_PCT:5}

# Log a progress line every N chunks
batch.progress-log-interval=10

# =============================================================
# Scheduler
# =============================================================
batch.schedule.cron=${BATCH_CRON:0 */5 * * * ?}
batch.schedule.enabled=false

# =============================================================
# MicroProfile Managed Executor (for parallel chunk workers)
# =============================================================
smallrye.context-propagation.enabled=true

# =============================================================
# HTTP / REST
# =============================================================
quarkus.http.port=8080
quarkus.http.access-log.enabled=true

# =============================================================
# Health & Metrics
# =============================================================
quarkus.smallrye-health.root-path=/health
quarkus.micrometer.export.prometheus.path=/metrics

# =============================================================
# Logging
# =============================================================
quarkus.log.level=INFO
quarkus.log.category."com.demo.batch".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# =============================================================
# Dev profile
# =============================================================
%dev.quarkus.hibernate-orm.stgdb.log.sql=false
%dev.quarkus.log.category."com.demo.batch".level=DEBUG
%dev.batch.chunk-size=100
%dev.batch.thread-pool-size=2

# =============================================================
# Test profile
# =============================================================
%test.quarkus.datasource.stgdb.db-kind=h2
%test.quarkus.datasource.stgdb.jdbc.url=jdbc:h2:mem:stgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.stgdb.username=sa
%test.quarkus.datasource.stgdb.password=
%test.quarkus.datasource.mndb.db-kind=h2
%test.quarkus.datasource.mndb.jdbc.url=jdbc:h2:mem:mndb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.mndb.username=sa
%test.quarkus.datasource.mndb.password=
%test.quarkus.hibernate-orm.stgdb.database.generation=drop-and-create
%test.quarkus.hibernate-orm.mndb.database.generation=drop-and-create
%test.batch.chunk-size=10
%test.batch.thread-pool-size=2
