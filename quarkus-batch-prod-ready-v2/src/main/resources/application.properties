# =============================================================================
# Application Identity
# =============================================================================
quarkus.application.name=quarkus-batch-prod
quarkus.application.version=1.0.0

# =============================================================================
# STG Database  (source — read PENDING, update to PROCESSING / COMPLETED / FAILED)
# =============================================================================
quarkus.datasource.stgdb.db-kind=postgresql
quarkus.datasource.stgdb.username=${STG_DB_USER:stg_user}
quarkus.datasource.stgdb.password=${STG_DB_PASSWORD:stg_pass}
quarkus.datasource.stgdb.jdbc.url=${STG_DB_URL:jdbc:postgresql://localhost:5432/stgdb}

# Connection pool tuned for high-throughput batch reads and status updates
quarkus.datasource.stgdb.jdbc.min-size=5
quarkus.datasource.stgdb.jdbc.max-size=20
quarkus.datasource.stgdb.jdbc.acquisition-timeout=30
quarkus.datasource.stgdb.jdbc.background-validation-interval=2m
quarkus.datasource.stgdb.jdbc.idle-removal-interval=5m
quarkus.datasource.stgdb.jdbc.max-lifetime=30m
quarkus.datasource.stgdb.jdbc.new-connection-sql=SELECT 1
quarkus.datasource.stgdb.jdbc.transaction-isolation-level=read-committed

# =============================================================================
# MAIN Database  (target — insert aggregated results)
# =============================================================================
quarkus.datasource.maindb.db-kind=postgresql
quarkus.datasource.maindb.username=${MAIN_DB_USER:main_user}
quarkus.datasource.maindb.password=${MAIN_DB_PASSWORD:main_pass}
quarkus.datasource.maindb.jdbc.url=${MAIN_DB_URL:jdbc:postgresql://localhost:5433/maindb}

quarkus.datasource.maindb.jdbc.min-size=5
quarkus.datasource.maindb.jdbc.max-size=20
quarkus.datasource.maindb.jdbc.acquisition-timeout=30
quarkus.datasource.maindb.jdbc.background-validation-interval=2m
quarkus.datasource.maindb.jdbc.idle-removal-interval=5m
quarkus.datasource.maindb.jdbc.max-lifetime=30m
quarkus.datasource.maindb.jdbc.new-connection-sql=SELECT 1

# =============================================================================
# Hibernate ORM — STG persistence unit
# =============================================================================
quarkus.hibernate-orm.stgdb.datasource=stgdb
quarkus.hibernate-orm.stgdb.packages=com.example.batch.entity.stg
quarkus.hibernate-orm.stgdb.database.generation=drop-and-create
quarkus.hibernate-orm.stgdb.sql-load-script=db/stg-seed.sql
quarkus.hibernate-orm.stgdb.log.sql=false
quarkus.hibernate-orm.stgdb.jdbc.statement-batch-size=50
quarkus.hibernate-orm.stgdb.jdbc.fetch-size=200

# =============================================================================
# Hibernate ORM — MAIN persistence unit
# =============================================================================
quarkus.hibernate-orm.maindb.datasource=maindb
quarkus.hibernate-orm.maindb.packages=com.example.batch.entity.main
quarkus.hibernate-orm.maindb.database.generation=drop-and-create
quarkus.hibernate-orm.maindb.log.sql=false
quarkus.hibernate-orm.maindb.jdbc.statement-batch-size=50

# =============================================================================
# Batch Processing Configuration
# =============================================================================
# Number of records claimed and processed in one scheduled execution
batch.chunk-size=${BATCH_CHUNK_SIZE:500}

# Scheduler cron — one chunk per trigger (override via env)
batch.schedule.cron=${BATCH_CRON:0/30 * * * * ?}
batch.schedule.enabled=${BATCH_SCHEDULE_ENABLED:true}

# Max consecutive empty-poll cycles before scheduler backs off (ms)
batch.empty-poll-backoff-ms=${BATCH_EMPTY_BACKOFF_MS:5000}

# =============================================================================
# HTTP / REST
# =============================================================================
quarkus.http.port=8080
quarkus.http.access-log.enabled=true

# =============================================================================
# OpenAPI
# =============================================================================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Quarkus Batch Processor API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Production batch API — trigger, monitor, manage

# =============================================================================
# Health & Metrics
# =============================================================================
quarkus.smallrye-health.root-path=/health
quarkus.micrometer.export.prometheus.path=/metrics

# =============================================================================
# Logging
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.example.batch".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# =============================================================================
# Dev profile
# =============================================================================
%dev.quarkus.log.category."com.example.batch".level=DEBUG
%dev.quarkus.hibernate-orm.stgdb.log.sql=false
%dev.batch.chunk-size=50
%dev.batch.schedule.cron=0/10 * * * * ?

# =============================================================================
# Test profile  (H2 in-memory)
# =============================================================================
%test.quarkus.datasource.stgdb.db-kind=h2
%test.quarkus.datasource.stgdb.jdbc.url=jdbc:h2:mem:stgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.stgdb.username=sa
%test.quarkus.datasource.stgdb.password=
%test.quarkus.datasource.maindb.db-kind=h2
%test.quarkus.datasource.maindb.jdbc.url=jdbc:h2:mem:maindb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.maindb.username=sa
%test.quarkus.datasource.maindb.password=
%test.quarkus.hibernate-orm.stgdb.database.generation=drop-and-create
%test.quarkus.hibernate-orm.stgdb.sql-load-script=db/stg-seed.sql
%test.quarkus.hibernate-orm.maindb.database.generation=drop-and-create
%test.batch.chunk-size=10
%test.batch.schedule.enabled=false
